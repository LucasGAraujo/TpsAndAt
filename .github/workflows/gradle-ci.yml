name: Gradle CI
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      - name: Run Gradle build
        run: ./gradlew build
